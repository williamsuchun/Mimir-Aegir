name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m mimir_aegir run --config configs/default.toml --demo --output output/ci-demo
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m compileall -q mimir_aegir tests
