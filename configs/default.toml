schema_version = "mimir.aegir.config.v1"

[video]
sample_interval_sec = 0.5
analysis_width = 160

[audio]
window_sec = 0.5

[candidates]
window_sec = 2.5
minimum_score = 0.16
chain_gap_sec = 1.25
